<style>
:root{
  --bg:#10121A; --surface:#1A1D29; --surface2:#252939; --text:#F2F3F8; --muted:#A0A5BA; --line:#2F3347;
  --yellow:#FFC933; --on-yellow:#16161A; --sel:rgba(255,201,51,.15);
  --good:#3FD488; --good-bg:rgba(63,212,136,.14); --bad:#FF7777; --bad-bg:rgba(255,119,119,.14);
  --serif:'Fraunces',Georgia,serif; --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --rfs:17px;
}
:root[data-theme="light"]{
  --bg:#F3F3EF; --surface:#FFFFFF; --surface2:#F0EFE9; --text:#1B1B1D; --muted:#5E6066; --line:#DEDDD5;
  --yellow:#FFD020; --on-yellow:#16161A; --sel:rgba(255,208,32,.22);
  --good:#17804A; --good-bg:#E3F4EA; --bad:#C8342B; --bad-bg:#FBE9E7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#app{position:fixed;left:0;right:0;top:0;height:100dvh;height:100%}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 clamp(14px,4vw,28px) calc(40px + env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:920px;margin:0 auto}

/* shared controls */
.ibtn{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .15s,background .15s}
.ibtn:hover{border-color:var(--muted)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.go{height:44px;min-width:110px;padding:0 24px;border-radius:12px;border:0;background:var(--yellow);color:var(--on-yellow);font-weight:700;font-size:16px;cursor:pointer}
.go:hover{filter:brightness(.95)}
.ghost{height:44px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:15px;cursor:pointer}
.ghost:hover{border-color:var(--muted)}

/* home */
.hhead{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 0 4px}
.brand{font-weight:700;font-size:14px;color:var(--yellow)}
.brand span{color:var(--muted);font-weight:500;margin-left:6px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.1;margin:18px 0 10px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px;max-width:60ch;font-size:15.5px}
.overall{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:14px;color:var(--muted)}
.obar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.obar i{display:block;height:100%;background:var(--yellow);border-radius:4px}
.note{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.list{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:720px){.list{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer;text-align:left;font-size:16px;transition:border-color .15s}
.row:hover{border-color:var(--yellow)}
.ring{--p:0;--c:var(--yellow);flex:0 0 54px;height:54px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-family:var(--serif);font-size:20px;font-weight:700}
.rt{flex:1;min-width:0}
.rt strong{display:block;font-weight:600;line-height:1.3}
.rt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.rt small.ok{color:var(--good);font-weight:600}
.row>svg{flex:0 0 18px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:28px;text-align:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13.5px;cursor:pointer;padding:10px}

/* reader */
.col{width:100%;max-width:900px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:0 clamp(10px,3vw,24px)}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.pill{background:var(--yellow);color:var(--on-yellow);font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;margin:0 auto}
.topbar .count{font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.segs{flex:0 0 auto;display:flex;gap:4px;padding:0 0 10px}
.segs button{flex:1;height:22px;padding:0;border:0;background:none;cursor:pointer;position:relative}
.segs button::after{content:"";position:absolute;left:0;right:0;top:9px;height:5px;border-radius:3px;background:var(--line);transition:background .15s}
.segs button.a::after{background:var(--yellow);opacity:.55}
.segs button.c::after{background:var(--yellow);opacity:1;top:7px;height:9px}
.segs button.gap{margin-left:8px}
.box{flex:1 1 0;min-height:110px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tools{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tools .grow{flex:1}
.tlabel{font-size:13px;color:var(--muted);margin:0 4px 0 6px}
@media(max-width:480px){.tlabel{display:none}}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;display:grid;place-items:center;font-size:14px;font-weight:700;line-height:1}
.sw.y{background:#FFE66D}.sw.g{background:#A8EDB4}.sw.p{background:#FFB8D4}
.sw.off{background:var(--surface2);color:var(--muted)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface)}
.tbtn{height:32px;min-width:32px;padding:0 8px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-size:13px;font-weight:700;cursor:pointer}
.tbtn:hover{border-color:var(--muted)}
.tbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
.scrollwrap{flex:1;min-height:0;position:relative}
.box-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px clamp(14px,3vw,26px) 28px;scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
.box-scroll::-webkit-scrollbar{width:8px}
.box-scroll::-webkit-scrollbar-thumb{background:var(--muted);border-radius:4px;border:2px solid var(--surface)}
.fade{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,var(--surface));pointer-events:none;opacity:0;transition:opacity .2s}
.fade.on{opacity:1}
.text{max-width:68ch;margin:0 auto;font-size:var(--rfs);line-height:1.72;user-select:text;-webkit-user-select:text}
.text h3{font-family:var(--serif);font-size:1.3em;line-height:1.2;margin:0 0 .6em}
.text p{margin:0 0 1em}
.text p:last-child{margin-bottom:0}
mark.hl{color:#141416;border-radius:3px;padding:0 1px}
mark.hl.y{background:#FFE66D}mark.hl.g{background:#A8EDB4}mark.hl.p{background:#FFB8D4}
.panel{flex:0 0 auto;max-height:54%;overflow-y:auto;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px}
#reader.expanded .panel{display:none}
.pmeta{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);margin-bottom:4px}
.pmeta b{color:var(--yellow);font-size:14px}
.instr{margin:0 0 10px;font-size:14px;color:var(--muted)}
.instr strong{color:var(--text)}
.qtext{margin:0 0 12px;font-size:17px;font-weight:600;line-height:1.5}
.qtext.gap{line-height:2.2}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface2);border:1.5px solid transparent;padding:10px 14px;border-radius:12px;font-size:15.5px;line-height:1.4;cursor:pointer;user-select:none;-webkit-user-select:none}
.opt:hover{border-color:var(--line)}
.opt .l{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);margin-top:-1px}
.opt[aria-checked="true"]{border-color:var(--yellow);background:var(--sel)}
.opt[aria-checked="true"] .l{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.ans{display:inline-block;vertical-align:middle;width:clamp(130px,42vw,230px);height:42px;margin:0 4px;padding:0 12px;font:inherit;font-size:16px;font-weight:600;color:var(--text);background:var(--surface2);border:1.5px solid var(--line);border-radius:10px}
.ans:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px var(--sel)}
.nav{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
.nav .ncount{font-size:14px;color:var(--muted);flex:1}
@media(max-height:700px){.opt{padding:8px 12px}.qtext{font-size:16px;margin-bottom:8px}.opts{gap:6px}.instr{margin-bottom:6px}}

/* results */
.rtop{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 0 0}
.rtop .ghost{border:0;padding:0 10px 0 4px;display:flex;align-items:center;gap:6px}
.rtop svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.score{text-align:center;padding:18px 0 8px}
.score .big{font-family:var(--serif);font-size:clamp(56px,16vw,88px);font-weight:700;color:var(--yellow);line-height:1}
.score .big small{font-size:.45em;color:var(--muted)}
.score p{margin:8px 0 0;color:var(--muted)}
.score .msg{color:var(--text);font-weight:600;font-size:18px;margin-top:12px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px}
details.rd{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
details.rd summary{padding:14px 16px;font-weight:600;cursor:pointer}
details.rd .text{padding:0 16px 18px;font-size:16px}
.rv-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rv{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:14px;padding:12px 14px}
.rv.good{border-left-color:var(--good)}
.rv .mk{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--bad-bg);color:var(--bad)}
.rv.good .mk{background:var(--good-bg);color:var(--good)}
.rv p{margin:0}
.rv .q{font-weight:600;margin-bottom:6px}
.rv u{text-decoration:none;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--bad-bg);color:var(--bad)}
.rv.good u{background:var(--good-bg);color:var(--good)}
.rv .your{font-size:14.5px;color:var(--muted)}
.rv .your b{color:var(--bad)}
.rv.good .your b{color:var(--good)}
.rv .key{font-size:14.5px;color:var(--good);font-weight:600;margin-top:2px}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:380px;width:100%}
.sheet p{margin:0 0 18px;font-size:16.5px;font-weight:600}
.sheet .acts{margin:0;justify-content:flex-end}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

king homework and writing reports, teachers would have more time and energy for the parts of the job humans do best."], "instr2": "2. Read the text again and complete the sentences. Use ONE WORD from the text for each answer.", "qs": [{"t": "mc", "q": "1. Some patients may feel more relaxed …", "opts": ["sharing personal information with their relatives.", "telling their problems to neighbours", "sharing personal information with robots."], "a": 2}, {"t": "mc", "q": "2. Anthony Seldon predicts that…", "opts": ["teachers will disappear in the future.", "teachers will assist robots in teaching process.", "robots will be useless in teaching."], "a": 1}, {"t": "mc", "q": "3. The writer says that students don’t go to school because…", "opts": ["some parts of the world are short of teachers", "they don’t want to study", "students are not satisfied with quality of education"], "a": 0}, {"t": "mc", "q": "4. According to the writer, teachers are leaving workplace because…", "opts": ["it is a stressful job.", "they don’t earn enough money", "they don’t have high qualification."], "a": 0}, {"t": "mc", "q": "5. Which of these problems does the writer NOT mention?", "opts": ["robots in education", "assistance of robots in arresting criminals", "cooperation of robots and teachers"], "a": 1}, {"t": "gap", "pre": "6. Several professions are required to have communication skills along with ", "post": ".", "a": ["creativity"]}, {"t": "gap", "pre": "7. Anthony Seldon claims that machines will ", "post": " information and teachers will help them.", "a": ["transfer", "transferring"]}, {"t": "gap", "pre": "8. 9-16 per cent of students under the age of 14 don’t go to school and this issue may be resolved with the help of ", "post": ".", "a": ["robots"]}, {"t": "gap", "pre": "9. Office workers may use ", "post": " to spend less time on routine activities such as answering emails.", "a": ["software"]}, {"t": "gap", "pre": "10. As long as machines were able to save teachers’ time from writing ", "post": " they would feel more energetic and have more spare time.", "a": ["reports"]}]}, {"n": 2, "title": "Cities of the future", "paras": ["The word ‘megacity’ was first used as far back as the early 1960s by French geographer Jean Gottman to describe the north-eastern United States. The term is used more widely now to mean an area with more than 10,000,000 people living closely together. A megacity can be a single area, or several areas together that make one huge area known as a ‘megalopolis’. As of March 2013, there were twenty-eight megacities in the world.", "When cities started to become too busy, people who could afford it moved out into the suburbs on the edge of the city. When the suburbs started attracting too many people, they moved further out into villages and the countryside. It was important to be close enough to the city to travel in every day for work, though. That’s why the countryside became more popular – London, for example, lost 15% of its population between 1950 and 1970, and Detroit in the USA lost 47%.", "However, movement away from cities does not mean the end of the city. Cities continue to spread, and in time these may grow into megacities with millions of people. According to one list, the majority of the world’s greatest megacities are to be found in Asia. The largest of these is the Tokyo-Yokohama area, home to 37,000,000 people, followed by the Indian capital Delhi, Seoul-Incheon in South Korea, Shanghai in China, and Mumbai, also in India.", "In the ancient world, Rome with its 1,000,000 people was a megacity for its time. And although London was one of the world’s first modern cities to have a million or more people, it is not currently high up on the list of megacities. In fact, the only western megacities are now New York City, Los Angeles, Moscow and Paris. The fastest-growing cities in the last ten years have all been in the developing world and this trend looks likely to continue. It is expected that by the year 2030, 60% of the world’s population will be living in megacities.", "Megacities everywhere have several things in common, which are mainly the problems they all experience. Among these are high traffic levels resulting in pollution, housing problems, and various social problems such as unemployment. Often the only housing that many people can afford is badly planned or of poor quality. However, all these problems are partly created by weak governments who don’t prepare for increased population before the people arrive.", "As megacities are likely to become more common, it seems that governments should try to plan for rising urban populations before it actually happens. But perhaps this is easier said than done."], "instr2": "2. Read the text again and complete the sentences. Use ONE WORD from the text for each answer.", "qs": [{"t": "mc", "q": "1. The term ‘megacity’ is used for the cities …", "opts": ["located in the European Continent.", "by an American to describe a big city", "where the number of population is over 10,000,000"], "a": 2}, {"t": "mc", "q": "2. The countryside became popular because …", "opts": ["it was easy to travel to work.", "villages became too expensive.", "the countryside had a nice view."], "a": 0}, {"t": "mc", "q": "3. According to the text…", "opts": ["Tokyo has been the world’s biggest megacity for some time.", "the world’s biggest megacities are mostly in Asia.", "London will soon be on the list of the world’s megacities."], "a": 1}, {"t": "mc", "q": "4. According to the writer, by 2030 megacities of the future will…", "opts": ["possibly include Rome.", "not include London.", "hold more than half of the world’s population."], "a": 2}, {"t": "mc", "q": "5. Which of these problems in megacities does the writer NOT mention?", "opts": ["crime", "people without jobs", "bad housing"], "a": 0}, {"t": "gap", "pre": "6. The data taken in March 2013 showed there were 28 ", "post": " in the world.", "a": ["megacities"]}, {"t": "gap", "pre": "7. Nearly half of the ", "post": " of Detroit moved away from the city.", "a": ["population"]}, {"t": "gap", "pre": "8. London was among the ", "post": " modern cities to have over a million people.", "a": ["first"]}, {"t": "gap", "pre": "9. Pollution in megacities is caused by a high level of ", "post": ".", "a": ["traffic"]}, {"t": "gap", "pre": "10. It would be a good idea for governments to ", "post": " urban development before urban population increases.", "a": ["plan"]}]}, {"n": 3, "title": "What is veganism?", "paras": ["Vegans try to live, as much as possible, in a way that avoids exploiting and being cruel to animals. This means following a plant-based diet. Vegans do not eat animals or animal-based products like meat, fish, seafood, eggs, honey and dairy products such as cheese. For many vegans, living a committed vegan lifestyle means not wearing clothes made from animal skins and avoiding any products which have been tested on animals.", "Vegetarians don’t eat meat or fish but they can eat eggs, honey and dairy products, but vegans don’t eat any animal-based food products. Vegans argue that suffering is caused in the production of these foods, for example they say that, on some dairy farms, male calves are killed because they are too expensive to keep, and on some farms, cows are killed when they get older and produce less milk. Similarly, on some egg farms, male chicks are killed because they do not produce eggs. As for honey, vegans say that bees make honey for bees, not for humans, and that bees’ health can suffer when humans take the honey from them. Vegans believe that the products they use and consume should be free from not just cruelty but any exploitation of animals.", "The Vegan Society was founded in 1944, but there is evidence of people deciding not to consume animal products over 2,000 years ago. The sixth-century BC Greek mathematician and philosopher Pythagoras was in favour of kindness to all species, and his diet could be described as vegetarian. There was a tradition of vegetarianism in the Indus Valley, Babylonian and ancient Egyptian civilisations even earlier. The Vegan Society points out that in 1806, the famous romantic poet Percy Bysshe Shelley was one of the first people to publicly object to eating eggs and dairy products on moral grounds.", "For many people, the main reason for going vegan is probably that they believe that animals and all other sentient beings should have the right to life and freedom. However, there are other reasons. Vegans argue that the production of meat and other animal products is hazardous for the environment. They point out that a huge quantity of water is needed to grow grain to feed animals in the meat industry. The enormous amount of grain which the meat industry needs often leads to forests being cut down and habitats being lost. In contrast, much lower quantities of grain and water are needed to sustain a vegan diet. In addition, many vegans say that all the nutrients our bodies need are contained in a carefully planned vegan diet and that this type of diet helps prevent some diseases."], "instr2": "2. Read the text again and complete the sentences. Use ONE WORD from the text for each answer.", "qs": [{"t": "mc", "q": "1. According to the article, “a committed vegan lifestyle” means", "opts": ["people do not hurt or kill animals", "people do not consume animal tested products", "people donate money to charities"], "a": 1}, {"t": "mc", "q": "2. Vegans do not consume honey because they believe that…", "opts": ["it might be toxic and hazardous for health", "bees might die out if honey is taken from them", "bees’ health might be damaged"], "a": 2}, {"t": "mc", "q": "3. According to the article, the famous romantic poet Percy Bysshe Shelley was one of the first people who…", "opts": ["stopped eating animal-based products", "claimed that eating animal-based products is unfair", "studied the influence of eggs and dairy products on our health"], "a": 1}, {"t": "mc", "q": "4. According to the article, vegans believe that meat production", "opts": ["results in the loss of habitats", "causes health issues such as obesity and diabetes", "leads to water shortages"], "a": 0}, {"t": "mc", "q": "5. Which of the following does the writer NOT mention?", "opts": ["the impact of vegan diet on meat prices", "reasons of becoming vegan", "environmental consequences of meat production"], "a": 0}, {"t": "gap", "pre": "6. Vegans do not consume eggs, seafood and products made of milk, for example, ", "post": ".", "a": ["cheese"]}, {"t": "gap", "pre": "7. Vegans claim that ", "post": " are killed as long as they cannot sustain the same level of milk production.", "a": ["cows"]}, {"t": "gap", "pre": "8. Vegans are sure that the products of consumption ought to be far from animal ", "post": ".", "a": ["exploitation"]}, {"t": "gap", "pre": "9. Greek mathematician and philosopher Pythagoras believed that all animals should be treated with the same level of ", "post": ".", "a": ["kindness"]}, {"t": "gap", "pre": "10. A large quantity of ", "post": " results in trees felling.", "a": ["grain"]}]}, {"n": 4, "title": "The four-day working week", "paras": ["For more than a century, the five-day working week has been the standard in most industrialised countries. It was introduced in the early twentieth century, when factory owners in the United States discovered that workers were more productive if they had two days of rest. Today, however, many economists and employers are asking whether the pattern still makes sense in an age of laptops, video calls and constant email.", "The most influential experiment so far took place in Iceland between 2015 and 2019, when around 2,500 public-sector employees, roughly one per cent of the country’s working population, moved to shorter hours without any reduction in pay. Researchers found that productivity stayed the same or improved in most workplaces, while employees reported lower levels of stress and a better balance between work and family life. Similar trials in Britain, Spain and Japan have produced comparable results, and several companies have made the change permanent.", "Supporters of the shorter week say the benefits go well beyond happier staff. Firms taking part in the trials noticed that workers took fewer sick days and that fewer people resigned, which saved the money normally spent on recruiting and training replacements. Meetings became shorter and more focused, because employees knew that time was limited. Some environmental campaigners have also argued that a shorter week could reduce commuting and so cut pollution.", "Critics, however, warn that the model will not suit every industry. A hospital cannot close on Fridays, and a shop must stay open when customers want to buy. In such jobs, a four-day week might simply mean longer shifts, which could leave employees exhausted rather than refreshed. There is also a concern that some workers might try to compress five days of work into four, ending up under even greater pressure than before.", "Perhaps the most realistic view is that there is no single solution. Some organisations may choose to reduce hours, others to offer flexible schedules or the option of working from home. What the experiments have shown is that the traditional pattern is not fixed by nature, and that with careful planning, working less does not necessarily mean achieving less."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. The five-day working week became standard because…", "opts": ["factory owners found that workers did better with two days of rest.", "governments introduced a law to protect employees.", "computers made shorter hours possible.", "trade unions demanded it during a national strike."], "a": 0}, {"t": "mc", "q": "2. What did the Icelandic experiment show?", "opts": ["Most employees preferred higher pay to shorter hours.", "Productivity fell, but stress levels were lower.", "Productivity generally stayed stable or rose, and stress decreased.", "Only public-sector workers benefited from the change."], "a": 2}, {"t": "mc", "q": "3. According to the text, firms saved money because…", "opts": ["staff took fewer sick days and fewer people left.", "they no longer needed to rent large offices.", "employees agreed to work for lower salaries.", "customers spent more in the shops."], "a": 0}, {"t": "mc", "q": "4. Critics of the four-day week argue that…", "opts": ["it has failed in every trial so far.", "it could mean longer shifts in some jobs.", "it would make workers less motivated.", "it is too expensive for large companies."], "a": 1}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["fewer resignations", "shorter meetings", "the cost of office rent", "stress levels of employees"], "a": 2}, {"t": "gap", "pre": "6. About one per cent of Iceland’s ", "post": " took part in the trial.", "a": ["working population"]}, {"t": "gap", "pre": "7. Companies noticed that employees took fewer ", "post": ".", "a": ["sick days"]}, {"t": "gap", "pre": "8. Meetings became shorter and more ", "post": " because time was limited.", "a": ["focused"]}, {"t": "gap", "pre": "9. In hospitals or shops, a shorter week could simply lead to longer ", "post": ".", "a": ["shifts"]}, {"t": "gap", "pre": "10. Some workers might try to ", "post": " five days of work into four.", "a": ["compress"]}]}, {"n": 5, "title": "Why teenagers need to sleep in", "paras": ["Anyone who has tried to wake a teenager at half past six in the morning knows how difficult it can be. Parents often blame laziness, but scientists say the real explanation is biological. During adolescence the body’s internal clock shifts, so that teenagers naturally feel sleepy later at night and want to wake up later in the morning. Most experts agree that teenagers need between eight and ten hours of sleep, yet many get far less.", "This mismatch matters because many schools start very early. In some districts in the United States, lessons begin before 7.30 a.m., which means that students must get up before dawn. Research has linked this pattern to a range of problems, including poor concentration, low mood and a higher risk of accidents among young drivers. Some researchers have also found a connection between lack of sleep and weight gain, since tired teenagers tend to choose sugary snacks for quick energy.", "A number of schools have decided to experiment. When schools in Seattle moved their start time from about 7.50 to 8.45 a.m. in 2016, a study found that students slept around half an hour more each night, and their attendance and grades improved slightly. Similar changes elsewhere have led to fewer students arriving late and fewer visits to the school nurse.", "Not everyone is convinced. Later starts also mean later finishes, which can disrupt after-school sports and part-time jobs. Working parents may find it hard to arrange childcare, and bus companies warn that changing timetables could be expensive. Some critics also suggest that teenagers will simply stay up later if they know they can sleep in, so the benefits may disappear.", "Nevertheless, many doctors’ organisations now recommend that secondary schools begin no earlier than 8.30 a.m. The debate shows that education policy is not only about what students learn but also about when their brains are ready to learn it."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. Why do teenagers find it hard to get up early?", "opts": ["Their parents do not set clear rules.", "Their internal clock changes during adolescence.", "They spend too many hours on their phones.", "They need less sleep than adults."], "a": 1}, {"t": "mc", "q": "2. Early school start times have been linked to…", "opts": ["fewer road accidents.", "better exam results.", "improved eating habits.", "difficulty concentrating and low mood."], "a": 3}, {"t": "mc", "q": "3. What happened in Seattle after the start time was changed?", "opts": ["Grades became much worse.", "Students began to go to bed later.", "Students slept about thirty minutes longer each night.", "Attendance fell slightly."], "a": 2}, {"t": "mc", "q": "4. Critics say that later starts may…", "opts": ["increase teachers’ salaries.", "make teenagers more tired in the afternoon.", "disrupt after-school activities and childcare.", "reduce the number of lessons per day."], "a": 2}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["problems for working parents", "teachers’ opinions of the change", "the cost of school buses", "the health of teenagers"], "a": 1}, {"t": "gap", "pre": "6. Experts say teenagers need between eight and ", "post": " hours of sleep.", "a": ["ten"]}, {"t": "gap", "pre": "7. Tired teenagers tend to choose ", "post": " for quick energy.", "a": ["sugary snacks"]}, {"t": "gap", "pre": "8. After the Seattle change, fewer students arrived ", "post": ".", "a": ["late"]}, {"t": "gap", "pre": "9. Later finishing times can affect sports and ", "post": " jobs.", "a": ["part-time", "part time"]}, {"t": "gap", "pre": "10. Doctors’ organisations advise ", "post": " schools to start no earlier than 8.30 a.m.", "a": ["secondary"]}]}, {"n": 6, "title": "The problem with microplastics", "paras": ["Plastic has transformed modern life. It is light, cheap and durable, which is why it appears in everything from food packaging to medical equipment. But the same qualities that make plastic so useful also make it a problem, because it does not break down naturally. Instead, it splits into ever smaller fragments. Those measuring less than five millimetres are known as microplastics, and scientists have now found them almost everywhere they have looked.", "Some microplastics are manufactured on purpose, such as the tiny beads once added to face scrubs and toothpaste. Many more come from larger objects. Every time synthetic clothes are washed, thousands of microscopic fibres are released into the water, and these are too small to be caught by most treatment plants. Car tyres also shed particles as they wear down on the road, and rain washes these into rivers and eventually the sea.", "The particles have been discovered in unexpected places. Researchers have detected microplastics in Arctic ice, in the deepest ocean trenches, and in the snow on high mountains. They have also been found in drinking water, in sea salt, and even in human blood. What this means for our health is still unclear. Some laboratory studies suggest that certain particles may cause inflammation, but scientists stress that more long-term research is needed before firm conclusions can be drawn.", "The effect on marine life is easier to observe. Fish, seabirds and turtles often mistake fragments for food, and their stomachs can fill up with material that provides no nutrition. Small animals at the bottom of the food chain also swallow the particles, which means they may be passed up to larger predators, including the fish that end up on our plates.", "Governments have begun to react. Several countries have banned microbeads in cosmetics, and others tax single-use plastic bags. Yet campaigners argue that these measures address only a small part of the problem. Most experts believe that the most effective solution is to produce less plastic in the first place, and to improve recycling so that fewer items are thrown away. Individuals can help by washing clothes less often, choosing natural fabrics, and reusing what they already own."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. Why is plastic such a problem for the environment?", "opts": ["It is heavier than most other materials.", "It is used only in food packaging.", "It does not decompose naturally but breaks into smaller pieces.", "It is too expensive to produce."], "a": 2}, {"t": "mc", "q": "2. What does the writer say about synthetic clothes?", "opts": ["They last longer than natural fabrics.", "They are the largest source of microplastics.", "They should be banned in all countries.", "They release fibres in the wash that treatment plants often fail to catch."], "a": 3}, {"t": "mc", "q": "3. What is the writer’s view of the effect of microplastics on human health?", "opts": ["It is much less important than the effect on animals.", "It is limited to people who drink bottled water.", "It has been proved to be very serious.", "It is unclear, and further research is needed."], "a": 3}, {"t": "mc", "q": "4. Why are marine animals harmed by plastic fragments?", "opts": ["They eat the fragments instead of real food.", "The fragments block sunlight.", "The fragments spread disease.", "The fragments cut their skin."], "a": 0}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["fines for companies that pollute rivers", "banning microbeads", "better recycling", "taxes on plastic bags"], "a": 0}, {"t": "gap", "pre": "6. Microplastics are pieces of plastic smaller than five ", "post": ".", "a": ["millimetres", "millimeters"]}, {"t": "gap", "pre": "7. Microbeads were once added to face scrubs and ", "post": ".", "a": ["toothpaste"]}, {"t": "gap", "pre": "8. Microplastics have been found in Arctic ice and the deepest ocean ", "post": ".", "a": ["trenches"]}, {"t": "gap", "pre": "9. Particles swallowed by small animals can travel up the ", "post": " to larger predators.", "a": ["food chain"]}, {"t": "gap", "pre": "10. Experts believe the best solution is to make less plastic and improve ", "post": ".", "a": ["recycling"]}]}, {"n": 7, "title": "Farming in the sky", "paras": ["By 2050, the world’s population is expected to reach almost ten billion, and feeding everyone will require a great deal more food than we produce today. At the same time, farmland is being lost to cities, erosion and climate change. Some entrepreneurs believe that one answer lies not in the countryside but in the city, in tall buildings where crops are grown in stacked layers.", "This method, known as vertical farming, uses no soil. Plants grow in trays with their roots in water containing nutrients, or in a fine mist, and artificial lights, usually LEDs, replace the sun. Because the environment is fully controlled, temperature, humidity and light can be adjusted to suit each crop. Some companies claim that their farms use up to 95 per cent less water than traditional agriculture and can produce harvests all year round, whatever the weather outside.", "Location is another advantage. Since the farms are built in or near cities, vegetables can reach shops within hours rather than days, which keeps them fresh and reduces the pollution created by long-distance transport. There is no need for pesticides either, as the crops are grown indoors, away from insects. In crowded cities such as Singapore and Tokyo, where land is scarce and expensive, vertical farms are already supplying supermarkets with lettuce and herbs.", "However, the technology has serious limitations. The biggest problem is energy. Powering thousands of lights and controlling the climate is costly, and unless the electricity comes from renewable sources, the environmental benefits may be cancelled out. A number of high-profile companies have closed down in recent years because their costs were simply too high. Also, most vertical farms grow only leafy greens and a few fruits, such as strawberries; staple foods like wheat, rice and potatoes need too much space and light to be grown profitably in this way.", "For this reason, most experts see vertical farming as a supplement to conventional agriculture rather than a replacement. It may not feed the world on its own, but it could provide fresh local food in places where traditional farming is difficult, and reduce pressure on the land we already use."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. Why do some entrepreneurs look to cities for food production?", "opts": ["Farmland is disappearing while the demand for food is growing.", "Farmers are leaving the countryside in large numbers.", "Cities have the best soil for growing crops.", "City workers refuse to buy imported food."], "a": 0}, {"t": "mc", "q": "2. How do plants grow in vertical farms?", "opts": ["In fields outside the city with extra lighting.", "In small pots on balconies.", "With their roots in nutrient-rich water or mist under artificial light.", "In soil under a glass roof."], "a": 2}, {"t": "mc", "q": "3. According to the text, one advantage of growing food in cities is that…", "opts": ["farmers do not need any training.", "the land is cheaper than in the countryside.", "vegetables reach the shops quickly and stay fresh.", "plants grow faster in warm city air."], "a": 2}, {"t": "mc", "q": "4. Why have some vertical farming companies closed?", "opts": ["Insects destroyed their crops.", "Customers did not like the taste of the food.", "City councils refused to give permission.", "Their costs were too high."], "a": 3}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["the lack of pesticides", "the use of energy", "the types of crops that can be grown", "the taste of the vegetables"], "a": 3}, {"t": "gap", "pre": "6. In vertical farms, artificial light, usually ", "post": ", replaces sunshine.", "a": ["LEDs", "LED"]}, {"t": "gap", "pre": "7. Growers can adjust temperature, humidity and light because the environment is fully ", "post": ".", "a": ["controlled"]}, {"t": "gap", "pre": "8. In Singapore and Tokyo, land is scarce and ", "post": ".", "a": ["expensive"]}, {"t": "gap", "pre": "9. Unless the electricity comes from ", "post": " sources, the environmental benefits may be lost.", "a": ["renewable"]}, {"t": "gap", "pre": "10. Most vertical farms grow only ", "post": " and a few fruits.", "a": ["leafy greens"]}]}, {"n": 8, "title": "When too many people visit", "paras": ["Venice, Barcelona, Amsterdam and Dubrovnik have one thing in common: they are all famous for their beauty, and they are all struggling with the number of people who come to see it. The word ‘overtourism’ was created to describe destinations where visitors are so numerous that they damage the quality of life for local residents and the experience of the tourists themselves.", "Cheap flights, budget accommodation and social media have made travel easier than ever before. Before the pandemic, Venice was receiving about twenty million visitors a year, while fewer than 50,000 people lived permanently in its historic centre. Cruise ships the size of small towns docked beside fragile buildings, and streets became so crowded that residents could hardly walk to work. Many of them moved away because shops selling everyday goods were replaced by souvenir stands.", "Housing is a related problem. In many cities, apartments that were once rented to families are now listed on holiday rental websites, where owners can earn far more from short-term visitors. As a result, rents rise, and workers such as nurses and teachers can no longer afford to live in the places where they work. In Barcelona, protesters have even sprayed tourists with water pistols to show their frustration.", "Authorities have tried a range of solutions. Venice introduced a small entry fee for day visitors in 2024 and banned large cruise ships from the city’s centre. Amsterdam has limited the number of hotel beds and restricted guided tours in its old district, and some cities have imposed a limit on the number of nights that homes can be rented to tourists. Other places try to spread visitors more evenly by promoting lesser-known towns and encouraging travel outside the summer months.", "Still, tourism provides jobs and income for millions of people, and few communities want to lose it altogether. The challenge is to find a balance. Many experts argue that the answer is not to stop people travelling but to make tourists more responsible: staying longer, spending money in local businesses, and treating a destination as a home to others, not a stage set for holiday photographs."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. The word ‘overtourism’ describes places where…", "opts": ["there are too many visitors, which harms both residents and tourists.", "tourists spend too little money.", "local people refuse to work in tourism.", "visitors are not allowed to stay overnight."], "a": 0}, {"t": "mc", "q": "2. Why did many residents leave Venice?", "opts": ["There were no schools for their children.", "Wages in tourism were too low.", "Everyday shops were replaced by souvenir stands and the streets were overcrowded.", "The city was in danger of sinking."], "a": 2}, {"t": "mc", "q": "3. What effect have holiday rental websites had on cities?", "opts": ["They have attracted more families.", "They have encouraged tourists to visit smaller towns.", "They have made rents rise, so essential workers cannot afford to live there.", "They have reduced the number of hotels."], "a": 2}, {"t": "mc", "q": "4. Which measure has Venice taken?", "opts": ["It has introduced an entry fee for day visitors.", "It has closed the city in the summer.", "It has stopped tourists using the canals.", "It has introduced a maximum number of visitors per day."], "a": 0}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["the expansion of airports", "cruise ships", "rental websites", "protests by residents"], "a": 0}, {"t": "gap", "pre": "6. Fewer than 50,000 people lived permanently in Venice’s ", "post": " before the pandemic.", "a": ["historic centre", "historic center"]}, {"t": "gap", "pre": "7. Large cruise ships docked next to fragile ", "post": ".", "a": ["buildings"]}, {"t": "gap", "pre": "8. Owners can earn more by listing apartments on holiday ", "post": " websites.", "a": ["rental"]}, {"t": "gap", "pre": "9. Some cities limit the number of ", "post": " that homes can be rented to tourists.", "a": ["nights"]}, {"t": "gap", "pre": "10. Other places promote lesser-known ", "post": " to spread visitors more evenly.", "a": ["towns"]}]}, {"n": 9, "title": "The bilingual brain", "paras": ["For much of the twentieth century, many teachers and parents believed that growing up with two languages would confuse children and slow their education. Some doctors even advised immigrant families to speak only the majority language at home. Today, research suggests almost the opposite: speaking more than one language may give the brain unexpected advantages.", "The key discovery is that a bilingual person’s languages are never completely ‘switched off’. When a Spanish–English speaker hears the word ‘dog’, both ‘perro’ and ‘dog’ become active in the brain at the same time. To speak correctly, the brain must constantly select the right word and suppress the other. This daily mental exercise seems to strengthen what psychologists call executive function, the set of skills that helps us focus attention, switch between tasks and ignore distractions.", "Several studies have found that bilingual children perform better than single-language children on tests that involve switching between rules. Among older adults, some research has found that bilinguals develop the symptoms of dementia around four years later, on average, than those who speak only one language. Scientists are careful to point out that bilingualism does not prevent illnesses, but it may help the brain to cope with damage for longer.", "The benefits are not limited to the brain. People who speak another language often find it easier to understand other cultures and to communicate with people from different backgrounds, and they may have better career opportunities. Many employers value language skills, particularly in international business, tourism and diplomacy.", "Yet the picture is more complicated than some headlines suggest. Not all studies have confirmed the bilingual advantage, and researchers disagree about how large it really is. Results seem to depend on how often people use both languages and how fluent they are. Some experts believe that it is the effort of active use, not simply knowing a language, that matters.", "The good news for adults is that it is never too late to begin. Learning a new language at any age gives the brain a challenge, and language learners often report improved memory and concentration. Even if the scientific debate continues, there is little doubt that learning a language is a worthwhile activity."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. In the past, some doctors advised immigrant families to…", "opts": ["teach their children three languages.", "send their children to language schools.", "use only the majority language at home.", "avoid speaking their own language in public."], "a": 2}, {"t": "mc", "q": "2. What happens in a bilingual brain when a word is heard?", "opts": ["The brain slows down while it decides.", "Both languages become active at the same time.", "The brain automatically translates it.", "The other language is completely switched off."], "a": 1}, {"t": "mc", "q": "3. What do scientists say about bilingualism and dementia?", "opts": ["Bilinguals develop the illness earlier than others.", "There is no connection at all.", "Bilinguals may show symptoms later, although the illness is not prevented.", "Bilinguals never develop dementia."], "a": 2}, {"t": "mc", "q": "4. Why do researchers disagree about the bilingual advantage?", "opts": ["Few people speak two languages fluently.", "Children and adults produce identical results.", "The tests used are too difficult.", "Results seem to depend on how often both languages are used and how well."], "a": 3}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["improved memory in adult learners", "higher results in mathematics exams", "understanding other cultures", "better career opportunities"], "a": 1}, {"t": "gap", "pre": "6. Psychologists call the skills that help us focus attention ", "post": ".", "a": ["executive function"]}, {"t": "gap", "pre": "7. The brain must select the right word and ", "post": " the other.", "a": ["suppress"]}, {"t": "gap", "pre": "8. Bilingual children perform better on tests involving switching between ", "post": ".", "a": ["rules"]}, {"t": "gap", "pre": "9. Many employers value language skills in business, tourism and ", "post": ".", "a": ["diplomacy"]}, {"t": "gap", "pre": "10. Not all studies have confirmed the bilingual ", "post": ".", "a": ["advantage"]}]}, {"n": 10, "title": "The real price of cheap clothes", "paras": ["Twenty years ago, most clothes shops offered two main collections each year, one for summer and one for winter. Today, some brands put hundreds of new designs into their shops every week. This business model, known as fast fashion, copies styles from catwalks and celebrities and produces them quickly and cheaply, so that customers can buy the latest trend for the price of a sandwich.", "For consumers, the attraction is obvious. Clothes are so inexpensive that people can afford to buy more of them, and social media encourages us to avoid wearing the same outfit twice. According to one industry report, the average person now buys around sixty per cent more garments than in the year 2000, but keeps each item for about half as long. Many items are worn only a handful of times before being thrown away.", "The environmental cost is heavy. Cotton is a very thirsty crop, and making a single pair of jeans can require thousands of litres of water. Dyeing and finishing textiles pollutes rivers in some producing countries, and synthetic fabrics such as polyester are made from oil and shed microscopic plastic fibres when they are washed. At the end of their short lives, most garments end up in landfill or are burned, because the fibres in mixed fabrics are almost impossible to separate and recycle.", "There is a human cost too. To keep prices low, brands often order from factories in countries where wages are low and safety regulations are weak. The collapse of the Rana Plaza factory building in Bangladesh in 2013, which killed more than a thousand workers, drew the world’s attention to these conditions. Since then, some companies have signed agreements to improve safety, but campaigners say progress is uneven.", "An alternative is slowly gaining popularity. Second-hand shopping, clothes rental and repair services are growing quickly, particularly among younger consumers who care about sustainability. Some shoppers are adopting the ‘30 wears’ rule, asking themselves before every purchase whether they will wear the item at least thirty times. Perhaps the most sustainable garment, as the saying goes, is the one that is already in your wardrobe."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. What is ‘fast fashion’?", "opts": ["A service that delivers clothes within an hour.", "A type of clothing designed for sport.", "A system of producing copies of fashionable styles quickly and cheaply.", "A way of making clothes by hand in small workshops."], "a": 2}, {"t": "mc", "q": "2. According to the industry report, compared with the year 2000 people now…", "opts": ["buy more clothes but keep them for a shorter time.", "spend less money on clothes.", "repair their clothes more often.", "buy fewer but better-quality garments."], "a": 0}, {"t": "mc", "q": "3. Why do most clothes not get recycled?", "opts": ["The fibres in mixed fabrics are almost impossible to separate.", "Recycling centres are too far away.", "It is illegal to recycle synthetic fabrics.", "Consumers refuse to give away their clothes."], "a": 0}, {"t": "mc", "q": "4. What was the effect of the Rana Plaza disaster?", "opts": ["All factories in Bangladesh were closed.", "Brands stopped ordering from Asia.", "Clothing prices rose sharply.", "It made the world notice the poor working conditions in the industry."], "a": 3}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["water pollution", "unsafe factories", "the high prices of designer labels", "clothes ending up in landfill"], "a": 2}, {"t": "gap", "pre": "6. Fast fashion copies styles from catwalks and ", "post": ".", "a": ["celebrities"]}, {"t": "gap", "pre": "7. Cotton is a very ", "post": " crop.", "a": ["thirsty"]}, {"t": "gap", "pre": "8. At the end of their short lives, most garments end up in ", "post": " or are burned.", "a": ["landfill"]}, {"t": "gap", "pre": "9. Brands order from factories where wages are low and safety ", "post": " are weak.", "a": ["regulations"]}, {"t": "gap", "pre": "10. Clothes rental, repair services and ", "post": " are growing quickly.", "a": ["second-hand shopping", "secondhand shopping", "second hand shopping"]}]}, {"n": 11, "title": "Are electric cars the answer?", "paras": ["The internal combustion engine has powered cars for over a century, but its dominance is now being challenged. In Norway, more than four out of five new cars sold are electric, and many other countries have announced plans to end the sale of new petrol and diesel vehicles within the next decade or two. Are electric cars really the solution to transport pollution, or is the picture more complicated?", "The main argument in their favour is that they produce no exhaust fumes. In crowded cities, where air quality is a serious health problem, this could make a real difference. Electric motors are also much more efficient than petrol engines, and the cars are quieter, cheaper to maintain because they have fewer moving parts, and cheaper to run. Drivers can even charge them at home overnight.", "However, the environmental advantages depend on where the electricity comes from. If a country’s power stations burn coal, charging an electric car simply moves pollution from the exhaust pipe to the power station. Manufacturing also has an impact: producing a battery requires large amounts of energy and materials such as lithium, cobalt and nickel, which are mined in ways that can harm local communities and ecosystems. Studies suggest that an electric car has to be driven for tens of thousands of kilometres before it makes up for the emissions created during its production.", "Practical problems remain. Electric vehicles are still more expensive to buy than equivalent petrol cars, although prices are falling. Charging points are not evenly distributed, and people who live in flats without private parking often have nowhere to plug in. Long journeys require planning, since charging takes longer than filling a tank. Many potential buyers also worry about how long batteries will last and how they will be disposed of or recycled.", "Even so, most analysts expect electric cars to become the norm. Battery technology is improving rapidly, and governments are investing in charging networks. Yet experts warn that switching to electric cars alone will not solve congestion, noise or road accidents. Better public transport, cycling routes and shorter journeys are likely to matter as much as the type of engine under the bonnet."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. Why could electric cars make a real difference in cities?", "opts": ["They are much faster than petrol cars.", "They produce no exhaust fumes, so the air could be cleaner.", "They are cheaper to buy.", "They need no charging points."], "a": 1}, {"t": "mc", "q": "2. The environmental advantage of an electric car depends on…", "opts": ["how far it is driven each week.", "where the electricity comes from.", "the size of its battery.", "the speed at which it charges."], "a": 1}, {"t": "mc", "q": "3. What does the writer say about battery production?", "opts": ["It uses materials which are mined in ways that can harm people and nature.", "It is cheaper than making a petrol engine.", "It is now completely clean.", "It is done only in countries with renewable energy."], "a": 0}, {"t": "mc", "q": "4. Which problem do people living in flats often face?", "opts": ["Their cars are too big for parking spaces.", "They may have nowhere to charge the car.", "Batteries do not work in cities.", "They cannot afford insurance."], "a": 1}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["the top speed of electric cars", "charging time", "recycling of batteries", "the number of moving parts"], "a": 0}, {"t": "gap", "pre": "6. Electric cars are cheaper to maintain because they have fewer ", "post": ".", "a": ["moving parts"]}, {"t": "gap", "pre": "7. If power stations burn ", "post": ", charging a car simply moves the pollution.", "a": ["coal"]}, {"t": "gap", "pre": "8. Batteries need materials such as lithium, cobalt and ", "post": ".", "a": ["nickel"]}, {"t": "gap", "pre": "9. Drivers can charge their cars at home ", "post": ".", "a": ["overnight"]}, {"t": "gap", "pre": "10. Better public transport and ", "post": " may matter as much as the type of engine.", "a": ["cycling routes"]}]}, {"n": 12, "title": "Attention: lost or just distracted?", "paras": ["Most of us have experienced it: we pick up a phone to check one message and, twenty minutes later, we are still scrolling. Many people now feel that their ability to concentrate is getting worse, and they often blame social media. But is the internet really damaging our attention, or is this simply the latest in a long line of technology panics?", "There is no doubt that many apps are designed to keep us using them. Features such as endless scrolling, autoplay videos and notifications take advantage of the way the brain responds to rewards. Every time we receive a ‘like’, a small amount of the chemical dopamine is thought to be released, which encourages us to check again. Former employees of technology companies have admitted that keeping users online for as long as possible is central to the business model, because more time online means more advertising revenue.", "Research suggests that the mere presence of a smartphone can be distracting. In one well-known experiment, participants who left their phones in another room performed better on tests of memory and problem-solving than those who kept them on the desk, even though the phones were switched off. Psychologists explain that part of the brain is constantly busy resisting the urge to look. Others point to the habit of ‘multitasking’, which is actually rapid switching between tasks and often makes us slower and more error-prone.", "Nevertheless, some scientists urge caution. They point out that similar fears were expressed about novels in the eighteenth century, and later about radio and television. Findings about social media are mixed, and it is difficult to prove that the technology causes attention problems rather than being used more by people who already struggle to concentrate. Moreover, online platforms allow people to learn new skills, stay in touch with distant friends and find communities that share their interests.", "What can users do? Experts suggest simple changes rather than giving up altogether: turning off non-essential notifications, keeping the phone out of the bedroom, and setting specific times for checking messages. Some people use apps that limit their own screen time. The aim is not to reject technology, but to make sure that we control it and it does not control us."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. Why do many apps use features such as autoplay and endless scrolling?", "opts": ["To protect users’ private data.", "To help users find information quickly.", "To reduce the amount of advertising.", "To keep users online for as long as possible."], "a": 3}, {"t": "mc", "q": "2. What did the experiment with smartphones show?", "opts": ["People whose phones were in another room performed better.", "Switched-off phones cannot distract anyone.", "Problem-solving is easier while multitasking.", "People with phones on the desk did better on memory tests."], "a": 0}, {"t": "mc", "q": "3. According to psychologists, ‘multitasking’ is really…", "opts": ["something only computers can do.", "a useful skill for young people.", "quick switching between tasks that often slows us down.", "a way of saving time."], "a": 2}, {"t": "mc", "q": "4. Why do some scientists urge caution about the effects of social media?", "opts": ["Most users already limit their screen time.", "No research has been done on the subject.", "Social media has been shown to be harmless.", "Similar fears have appeared before, and cause and effect are hard to prove."], "a": 3}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["the age at which children should get a first phone", "keeping phones out of the bedroom", "turning off notifications", "limiting screen time with apps"], "a": 0}, {"t": "gap", "pre": "6. Endless scrolling, autoplay videos and ", "post": " take advantage of the brain’s response to rewards.", "a": ["notifications"]}, {"t": "gap", "pre": "7. More time online means more ", "post": " for technology companies.", "a": ["advertising revenue"]}, {"t": "gap", "pre": "8. In the experiment, the phones were switched ", "post": ".", "a": ["off"]}, {"t": "gap", "pre": "9. Experts suggest keeping the phone out of the ", "post": ".", "a": ["bedroom"]}, {"t": "gap", "pre": "10. Some people use apps that limit their own ", "post": ".", "a": ["screen time"]}]}, {"n": 13, "title": "Why libraries still matter", "paras": ["In an age when almost any fact can be found on a smartphone in seconds, it is tempting to think that public libraries have become obsolete. Across many countries, budgets have been cut and branches closed, often on the grounds that fewer people borrow books than in the past. But in cities that have invested in their libraries, the buildings are busier than ever.", "What has changed is the way libraries are used. Many now offer free internet access and computers, which are essential for people without them at home, such as those applying for jobs or filling in official forms. Librarians run classes in digital skills, language lessons for newcomers, and homework clubs for schoolchildren. Some even lend tools, musical instruments and board games alongside books.", "Libraries also provide something that is increasingly rare: a public space where people can spend time without having to buy anything. Cafés and shopping centres expect customers to spend money, and many parks are closed at night, but a library welcomes everyone. For elderly people living alone, students without a quiet place to study, or parents with small children, it can be an important place to meet others. Sociologists sometimes describe such places as ‘social infrastructure’, as necessary to communities as roads and bridges.", "Supporters also argue that libraries protect equality of opportunity. Books, newspapers and online resources are expensive, and without libraries they would be available only to those who could afford them. Research in several countries has linked access to libraries with better reading skills among children from low-income families.", "The counterargument is one of cost. Running a library requires staff, buildings, heating and constant updating of stock, and local councils facing tight budgets must choose between libraries and services such as road repairs or care for the elderly. Some councils have handed libraries over to volunteers, though critics say that unpaid staff cannot replace trained librarians.", "The future of libraries probably lies in adapting rather than disappearing. As their role expands from lending books to supporting communities, many people argue that they deserve to be seen not as a luxury, but as a vital public service."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. Why is it tempting to think that libraries are no longer needed?", "opts": ["Schools now provide all the books children need.", "Most people prefer to buy their own books.", "Libraries are always too crowded.", "Information is easy to find on phones."], "a": 3}, {"t": "mc", "q": "2. How has the use of libraries changed?", "opts": ["People spend less time inside them.", "They no longer lend books.", "Many now offer services such as internet access, classes and clubs.", "They are used mainly by tourists."], "a": 2}, {"t": "mc", "q": "3. ‘Social infrastructure’ describes places that are…", "opts": ["designed for scientific research.", "as necessary to communities as roads and bridges.", "owned by the government.", "built only in large cities."], "a": 1}, {"t": "mc", "q": "4. What do critics say about libraries run by volunteers?", "opts": ["They are less popular with young people.", "They open for fewer hours.", "They cost more than council libraries.", "Unpaid staff cannot take the place of trained librarians."], "a": 3}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["fines for returning books late", "equality of opportunity", "homework clubs", "free computers"], "a": 0}, {"t": "gap", "pre": "6. Some libraries have closed because fewer people ", "post": " books.", "a": ["borrow"]}, {"t": "gap", "pre": "7. Free internet access helps people applying for ", "post": ".", "a": ["jobs"]}, {"t": "gap", "pre": "8. Cafés and ", "post": " expect customers to spend money.", "a": ["shopping centres", "shopping centers"]}, {"t": "gap", "pre": "9. Access to libraries has been linked with better ", "post": " skills among children from low-income families.", "a": ["reading"]}, {"t": "gap", "pre": "10. Some councils have handed libraries over to ", "post": ".", "a": ["volunteers"]}]}, {"n": 14, "title": "Bringing back the wolf", "paras": ["In 1995, a small group of grey wolves was released in Yellowstone National Park in the United States. The animals had been absent for nearly seventy years, hunted to extinction in the region because ranchers saw them as a threat to their livestock. The decision to bring them back was controversial, but it has become one of the best-known examples of ‘rewilding’, the large-scale restoration of natural ecosystems.", "The first noticeable change was in the behaviour of the elk, a large type of deer, which had grown in number and grazed heavily on young trees along the riverbanks. With wolves around, the elk began to avoid open valleys where they were easy to hunt. Willows and aspens started to recover, providing food and building material for beavers, and shelter for songbirds. Some scientists have argued that the change even affected rivers, as tree roots stabilised the banks and streams became deeper and cooler.", "However, researchers now warn that the story has sometimes been told too simply. Elk numbers were already declining for other reasons, including hunting by humans and periods of drought, and the recovery of plants may not be due to wolves alone. Nonetheless, most agree that top predators can influence an entire ecosystem in ways that are hard to predict.", "Rewilding projects have since started in many parts of Europe. In Scotland, campaigners hope to bring back lynx, while in the Netherlands, herds of wild horses and cattle are managing grasslands. Supporters say that such projects can store carbon, reduce flooding, and provide new opportunities for tourism.", "But local people are not always enthusiastic. Farmers fear for their animals and worry that land will be taken out of production. Where predators return, some compensation schemes pay farmers for lost sheep, and fencing or guard dogs can help, but conflict remains. Critics also point out that ecosystems have changed since the predators disappeared, and that restoring the past is impossible. Perhaps the real value of rewilding is not returning to an earlier time, but allowing nature to manage itself with as little human control as possible."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. Why were wolves originally killed in the Yellowstone region?", "opts": ["Farmers considered them a danger to their animals.", "They carried dangerous diseases.", "They attacked tourists in the park.", "They ate too many elk."], "a": 0}, {"t": "mc", "q": "2. How did the elk change their behaviour when wolves returned?", "opts": ["They avoided open valleys.", "They stopped eating young trees.", "They left the park.", "They began to hunt in groups."], "a": 0}, {"t": "mc", "q": "3. Why do researchers say the wolf story has been told too simply?", "opts": ["No trees recovered along the rivers.", "Elk numbers were also affected by other factors.", "The wolves soon left the park.", "The wolves were not really rewilded."], "a": 1}, {"t": "mc", "q": "4. What do supporters say rewilding can achieve?", "opts": ["The storage of carbon and a reduction in flooding.", "Lower numbers of tourists.", "Complete protection of farm animals.", "Cheaper meat for consumers."], "a": 0}, {"t": "mc", "q": "5. Which of these does the writer NOT mention?", "opts": ["compensation for farmers", "the cost of releasing the animals", "fences and guard dogs", "wild horses in the Netherlands"], "a": 1}, {"t": "gap", "pre": "6. The wolves had been ", "post": " from Yellowstone for nearly seventy years.", "a": ["absent"]}, {"t": "gap", "pre": "7. The elk grazed heavily on young trees along the ", "post": ".", "a": ["riverbanks", "river banks"]}, {"t": "gap", "pre": "8. Recovering willows provided food and building material for ", "post": ".", "a": ["beavers"]}, {"t": "gap", "pre": "9. In Scotland, campaigners hope to bring back ", "post": ".", "a": ["lynx"]}, {"t": "gap", "pre": "10. Most researchers agree that ", "post": " can influence a whole ecosystem.", "a": ["top predators"]}]}, {"n": 15, "title": "The dawn of space tourism", "paras": ["For most of history, space has been the exclusive territory of government astronauts, who spent years in training and risked their lives for science. In recent years, that has started to change. Private companies have begun to sell tickets to ordinary passengers, and in 2021 several civilians travelled beyond the atmosphere within a few months of each other. The age of space tourism has begun.", "Currently, there are two types of experience. The first is a suborbital flight, in which the spacecraft climbs to the edge of space, gives passengers a few minutes of weightlessness and a view of the curved Earth, and then returns. These trips last about ten minutes in total, and seats have been sold for several hundred thousand dollars each. The second is an orbital flight, which is far more expensive and can last several days. So far, only a small number of extremely wealthy customers have been able to afford them.", "Supporters believe tourism could speed up the development of the space industry. As the number of flights grows, costs should fall, in the same way that early air travel became cheaper as it became commonplace. Reusable rockets, which land and fly again, have already reduced launch costs significantly. Enthusiasts also say that seeing the Earth from above can change people’s attitudes, a psychological effect that astronauts have described as the ‘overview effect’.", "Critics take a very different view. They point out that a rocket launch releases large amounts of gases and soot into the upper atmosphere, and that the effect on the climate of a growing number of launches is not yet fully understood. It also seems unfair, they say, that vast sums of money are being spent on brief holidays for a wealthy few while urgent problems on Earth, such as poverty and climate change, remain unsolved. There are safety questions too, since a serious accident would threaten not only passengers but the whole industry’s reputation.", "For the moment, space tourism remains a very small industry, and it is impossible to say whether it will follow the path of aviation or remain a novelty for the rich. What seems certain is that as technology develops, more of us will be able to look at our planet from space, if only in our imagination."], "instr2": "2. Read the text again and complete the sentences. Use NO MORE THAN TWO WORDS from the text for each answer.", "qs": [{"t": "mc", "q": "1. What has changed in recent years?", "opts": ["Governments have stopped funding space travel.", "Companies have started to sell tickets to ordinary people.", "Astronauts no longer need training.", "Space flights have become much longer."], "a": 1}, {"t": "mc", "q": "2. What is a suborbital flight?", "opts": ["A journey that lasts several days.", "A short trip to the edge of space with a few minutes of weightlessness.", "A flight around the Moon.", "A training flight for astronauts."], "a": 1}, {"t": "mc", "q": "3. Why do supporters expect costs to fall?", "opts": ["Governments will pay for tickets.", "Rockets will become smaller.", "There will be more flights, and rockets can be reused.", "The number of passengers will decrease."], "a": 2}, {"t": "mc", "q": "4. What concern do critics raise about rocket launches?", "opts": ["They damage radio signals.", "Their effect on the climate is not fully understood.", "They use up the world’s supply of fuel.", "They frighten people living near launch sites."], "a": 1}, {"t": "mc", function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function norm(s){return String(s).toLowerCase().replace(/[\u2010-\u2015-]/g,' ').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();}
function peek(n){return store.readings[n]||null;}
function fresh(best){return {a:new Array(TOTAL).fill(null),i:0,best:best==null?null:best,score:null,done:false,hl:null};}
function rec(n){return store.readings[n]||(store.readings[n]=fresh());}
function filled(v){return v!==null&&v!==undefined&&v!=='';}
function answeredCount(r){var c=0;r.a.forEach(function(v){if(filled(v))c++;});return c;}
function isRight(q,v){if(!filled(v))return false;if(q.t==='mc')return v===q.a;var nv=norm(v);return q.a.some(function(x){return norm(x)===nv;});}
function scoreOf(R,r){var s1=0,s2=0;R.qs.forEach(function(q,i){if(isRight(q,r.a[i])){if(i<5)s1++;else s2++;}});return [s1,s2];}
